  <style>

<body>


  <!-- ==================================================
       HEADER
       ================================================== -->

  <div class="header">

    <h1>THE BRONX MUSEUM</h1>

    <p>ADMISSION SCANNER</p>

  </div>


  <!-- ==================================================
       LOGIN SCREEN
       ================================================== -->

  <div id="loginScreen">

    <h2>EMPLOYEE ACCESS</h2>

    <p>
      Please sign in with your Bronx Museum Google account
      to access the admission scanner.
    </p>

    <div id="googleButton"></div>

    <div id="loginStatus"></div>

  </div>


  <!-- ==================================================
       SCANNER SCREEN
       ================================================== -->

  <div id="scannerScreen">

    <div id="reader"></div>

    <div id="result" class="waiting">
      READY TO SCAN
    </div>

  </div>


  <script>


    /****************************************************
     * CONFIGURATION
     ****************************************************/

    const API_URL =
      "https://script.google.com/macros/s/AKfycbx7JSR84v2SabsJbyfS4hTjwL8saEyMyYuOSBgHs8t2CYiZO4D53j4G28An9imGVrsy/exec";


    /*
     * IMPORTANT:
     * This must be the same Google OAuth Client ID
     * already stored in Apps Script as GOOGLE_CLIENT_ID.
     *
     * Replace the value below with your existing
     * Google Client ID.
     */

    const GOOGLE_CLIENT_ID =
      "950942164471-7k7im4k3pcmccpobdqq2udlt0mg1p1in.apps.googleusercontent.com";


    /****************************************************
     * SCANNER STATE
     ****************************************************/

    let lastScan = "";
    let processing = false;


    /****************************************************
     * GOOGLE AUTHENTICATION
     ****************************************************/

    function handleGoogleCredential(response) {

      const loginStatus =
        document.getElementById("loginStatus");

      loginStatus.innerHTML =
        "Verifying employee access...";


      /*
       * Send the Google ID token to Apps Script.
       */

      const authUrl =
        API_URL +
        "?auth=google" +
        "&credential=" +
        encodeURIComponent(response.credential);


      window.location.href = authUrl;

    }


    /****************************************************
     * INITIALIZE GOOGLE SIGN-IN
     ****************************************************/

    function initializeGoogleSignIn() {

      if (
        !window.google ||
        !google.accounts ||
        !google.accounts.id
      ) {

        document.getElementById("loginStatus").innerHTML =
          "Google Sign-In is still loading. Please wait...";

        setTimeout(
          initializeGoogleSignIn,
          500
        );

        return;

      }


      google.accounts.id.initialize({

        client_id: GOOGLE_CLIENT_ID,

        callback: handleGoogleCredential,

        auto_select: false,

        cancel_on_tap_outside: true

      });


      google.accounts.id.renderButton(

        document.getElementById("googleButton"),

        {
          theme: "outline",
          size: "large",
          text: "signin_with",
          shape: "rectangular",
          width: 300
        }

      );

    }


    /****************************************************
     * CHECK FOR AUTHORIZATION CODE
     ****************************************************/

    function checkAuthorization() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const authCode =
        params.get("auth");


      /*
       * If there is no authorization code,
       * remain on the login screen.
       */

      if (!authCode) {

        initializeGoogleSignIn();

        return;

      }


      /*
       * Do NOT treat the Google ID token itself
       * as authorization.
       *
       * The Apps Script backend must have already
       * converted it into a short-lived authorization
       * code.
       */


      document.getElementById("loginScreen").style.display =
        "block";


      document.getElementById("googleButton").style.display =
        "none";


      document.getElementById("loginStatus").innerHTML =
        "Verifying scanner authorization...";


      /*
       * The current Apps Script implementation redirects
       * successful authentication to this GitHub page
       * using ?auth=ONE_TIME_CODE.
       *
       * For now, we store that code locally and use it
       * as the scanner authorization state.
       */

      sessionStorage.setItem(
        "scannerAuthCode",
        authCode
      );


      /*
       * Remove the authorization code from the visible
       * browser URL.
       */

      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );


      /*
       * Show scanner.
       */

      document.getElementById("loginScreen").style.display =
        "none";

      document.getElementById("scannerScreen").style.display =
        "block";


      startScanner();

    }


    /****************************************************
     * RESULT DISPLAY
     ****************************************************/

    function showResult(data) {

      const resultDiv =
        document.getElementById("result");


      if (data.status === "approved") {

        resultDiv.className = "approved";

        resultDiv.innerHTML =
          "✓ ENTRY GRANTED<br><br>" +
          escapeHtml(
            data.name || "Visitor"
          );

      } else {

        resultDiv.className = "rejected";

        resultDiv.innerHTML =
          "✕ " +
          escapeHtml(
            data.title || "INVALID"
          ) +
          "<br><br>" +
          escapeHtml(
            data.message || ""
          );

      }


      setTimeout(function() {

        resultDiv.className = "waiting";

        resultDiv.innerHTML =
          "READY TO SCAN";

        processing = false;

      }, 3000);

    }


    /****************************************************
     * HTML ESCAPE
     ****************************************************/

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /****************************************************
     * APPS SCRIPT API CALL
     ****************************************************/

    function checkTicketFromGitHub(ticketId) {

      if (processing) {
        return;
      }

      processing = true;


      const callbackName =
        "ticketCallback_" +
        Date.now();


      window[callbackName] =
        function(data) {

          try {

            showResult(data);

          } finally {

            delete window[callbackName];

          }

        };


      const script =
        document.createElement("script");


      const separator =
        API_URL.includes("?")
          ? "&"
          : "?";


      script.src =
        API_URL +
        separator +
        "api=check" +
        "&ticket=" +
        encodeURIComponent(ticketId) +
        "&callback=" +
        callbackName;


      script.onerror =
        function() {

          delete window[callbackName];


          const resultDiv =
            document.getElementById("result");


          resultDiv.className =
            "rejected";


          resultDiv.innerHTML =
            "✕ CONNECTION ERROR<br><br>" +
            "Unable to contact the ticket system.";


          processing = false;


          setTimeout(function() {

            resultDiv.className =
              "waiting";

            resultDiv.innerHTML =
              "READY TO SCAN";

          }, 3000);

        };


      document.body.appendChild(script);


      setTimeout(function() {

        if (script.parentNode) {

          script.parentNode.removeChild(
            script
          );

        }

      }, 10000);

    }


    /****************************************************
     * QR SCAN HANDLER
     ****************************************************/

    function onScanSuccess(decodedText) {

      if (processing) {
        return;
      }


      if (decodedText === lastScan) {
        return;
      }


      lastScan =
        decodedText;


      let ticketId =
        decodedText;


      /*
       * Existing QR codes contain:
       *
       * WEB_APP_URL?ticket=UUID
       *
       * Extract the ticket parameter when
       * a URL is scanned.
       */

      try {

        const url =
          new URL(decodedText);


        const extracted =
          url.searchParams.get("ticket");


        if (extracted) {

          ticketId =
            extracted;

        }

      } catch (err) {

        /*
         * If the QR code is just the UUID itself,
         * use it directly.
         */

        ticketId =
          decodedText;

      }


      checkTicketFromGitHub(
        ticketId
      );


      /*
       * Allow the same QR code to be scanned again
       * after the result cycle has completed.
       */

      setTimeout(function() {

        lastScan = "";

      }, 3000);

    }


    /****************************************************
     * CAMERA ERROR
     ****************************************************/

    function showCameraError(message) {

      const resultDiv =
        document.getElementById("result");


      resultDiv.className =
        "camera-error";


      resultDiv.innerHTML =
        "✕ CAMERA UNAVAILABLE<br><br>" +
        escapeHtml(message);

    }


    /****************************************************
     * CAMERA INITIALIZATION
     ****************************************************/

    let html5QrCode;


    function startScanner() {

      html5QrCode =
        new Html5Qrcode("reader");


      Html5Qrcode.getCameras()

        .then(devices => {

          if (
            !devices ||
            devices.length === 0
          ) {

            showCameraError(
              "No camera was found on this device."
            );

            return;

          }


          /*
           * Default to first available camera.
           */

          let cameraId =
            devices[0].id;


          /*
           * Prefer rear-facing camera.
           */

          const rearCamera =
            devices.find(device => {

              if (!device.label) {
                return false;
              }


              const label =
                device.label.toLowerCase();


              return (
                label.includes("back") ||
                label.includes("rear") ||
                label.includes("environment")
              );

            });


          if (rearCamera) {

            cameraId =
              rearCamera.id;

          }


          /*
           * Start camera.
           */

          return html5QrCode.start(

            cameraId,

            {
              fps: 10,

              qrbox: {
                width: 250,
                height: 250
              }

            },

            onScanSuccess,

            function(errorMessage) {

              /*
               * Normal scanning behavior.
               * Do not display every failed frame.
               */

            }

          );

        })

        .catch(err => {

          console.error(
            "Camera initialization error:",
            err
          );


          showCameraError(
            "Please allow camera access in Safari."
          );

        });

    }


    /****************************************************
     * PAGE INITIALIZATION
     ****************************************************/

    window.addEventListener(
      "load",
      checkAuthorization
    );

  </script>


</body>

</html>
