<!DOCTYPE html>
<html>

<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <meta name="theme-color"
        content="#000000">

  <title>THE BRONX MUSEUM — Admission Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript">
  </script>

  <style>

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #ffffff;
      color: #000000;
      margin: 0;
      min-height: 100vh;
    }

    .header {
      margin-bottom: 30px;
    }

    .header h1 {
      font-family: Impact, Arial, sans-serif;
      text-transform: uppercase;
      font-size: 52px;
      line-height: 1;
      margin: 0;
      color: #000000;
    }

    .header p {
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 14px;
      margin-top: 12px;
      color: #000000;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      border: 2px solid #000000;
      border-radius: 12px;
      overflow: hidden;
      background: #ffffff;
    }

    #result {
      width: 100%;
      max-width: 500px;
      margin: 25px auto 0;
      padding: 25px;
      border-radius: 12px;
      font-size: 24px;
      font-weight: bold;
      line-height: 1.3;
      transition: all 0.2s ease;
    }

    .approved {
      background: #2E7D32;
      color: #ffffff;
    }

    .rejected {
      background: #C62828;
      color: #ffffff;
    }

    .waiting {
      background: #000000;
      color: #ffffff;
    }

    .camera-error {
      background: #C62828;
      color: #ffffff;
    }

    #reader button {
      font-family: Arial, sans-serif;
      border-radius: 6px;
    }

    #reader select {
      font-family: Arial, sans-serif;
      padding: 8px;
      border-radius: 6px;
    }

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      .header h1 {
        font-size: 42px;
      }

      .header {
        margin-bottom: 22px;
      }

      #result {
        font-size: 21px;
        padding: 22px;
      }

    }

  </style>

</head>


<body>


  <div class="header">

    <h1>THE BRONX MUSEUM</h1>

    <p>ADMISSION SCANNER</p>

  </div>


  <div id="reader"></div>


  <div id="result" class="waiting">
    READY TO SCAN
  </div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbx7JSR84v2SabsJbyfS4hTjwL8saEyMyYuOSBgHs8t2CYiZO4D53j4G28An9imGVrsy/exec";


let lastScan = "";
let processing = false;


/**************************************************
 * HTML ESCAPE
 **************************************************/

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/**************************************************
 * RESULT DISPLAY
 **************************************************/

function showResult(data) {

  const resultDiv =
    document.getElementById("result");


  if (data.status === "approved") {

    resultDiv.className = "approved";

    resultDiv.innerHTML =
      "✓ ENTRY GRANTED<br><br>" +
      escapeHtml(data.name || "Visitor");

  }

  else if (data.status === "closed") {

    resultDiv.className = "rejected";

    resultDiv.innerHTML =
      "✕ MUSEUM CLOSED<br><br>" +
      escapeHtml(
        data.message || "Museum is currently closed."
      );

  }

  else {

    resultDiv.className = "rejected";

    resultDiv.innerHTML =
      "✕ " +
      escapeHtml(data.title || "INVALID") +
      "<br><br>" +
      escapeHtml(data.message || "");

  }


  setTimeout(function() {

    resultDiv.className = "waiting";

    resultDiv.innerHTML =
      "READY TO SCAN";

    processing = false;

  }, 3000);

}


/**************************************************
 * TICKET VALIDATION
 **************************************************/

function checkTicketFromGitHub(ticketId) {

  if (processing) {
    return;
  }


  processing = true;


  const callbackName =
    "ticketCallback_" + Date.now();


  window[callbackName] = function(data) {

    try {

      showResult(data);

    }

    finally {

      delete window[callbackName];

    }

  };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?api=check" +
    "&ticket=" +
    encodeURIComponent(ticketId) +
    "&callback=" +
    callbackName;


  script.onerror = function() {

    delete window[callbackName];


    const resultDiv =
      document.getElementById("result");


    resultDiv.className = "rejected";

    resultDiv.innerHTML =
      "✕ CONNECTION ERROR<br><br>" +
      "Unable to contact the ticket system.";


    processing = false;


    setTimeout(function() {

      resultDiv.className = "waiting";

      resultDiv.innerHTML =
        "READY TO SCAN";

    }, 3000);

  };


  document.body.appendChild(script);


  setTimeout(function() {

    if (script.parentNode) {

      script.parentNode.removeChild(script);

    }

  }, 10000);

}


/**************************************************
 * QR SCAN HANDLER
 **************************************************/

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }


  if (decodedText === lastScan) {
    return;
  }


  lastScan = decodedText;


  let ticketId = decodedText;


  try {

    const url =
      new URL(decodedText);


    const extracted =
      url.searchParams.get("ticket");


    if (extracted) {

      ticketId = extracted;

    }

  }

  catch (err) {

    ticketId = decodedText;

  }


  checkTicketFromGitHub(ticketId);


  setTimeout(function() {

    lastScan = "";

  }, 3000);

}


/**************************************************
 * CAMERA ERROR
 **************************************************/

function showCameraError(message) {

  const resultDiv =
    document.getElementById("result");


  resultDiv.className =
    "camera-error";


  resultDiv.innerHTML =
    "✕ CAMERA UNAVAILABLE<br><br>" +
    escapeHtml(message);

}


/**************************************************
 * START CAMERA
 **************************************************/

function startScanner() {

  const html5QrCode =
    new Html5Qrcode("reader");


  html5QrCode.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    onScanSuccess,

    function(errorMessage) {

      // Normal scanning behavior.
      // Ignore individual failed frames.

    }

  )

  .then(function() {

    const resultDiv =
      document.getElementById("result");


    resultDiv.className =
      "waiting";


    resultDiv.innerHTML =
      "READY TO SCAN";

  })

  .catch(function(error) {

    console.error(
      "Camera initialization error:",
      error
    );


    showCameraError(
      "Please allow camera access in Safari."
    );

  });

}


/**************************************************
 * START APPLICATION
 **************************************************/

window.addEventListener(
  "load",
  startScanner
);

</script>


</body>

</html>
