<!DOCTYPE html>
<html>

<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <meta name="theme-color"
        content="#000000">

  <title>THE BRONX MUSEUM — Admission Scanner</title>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client"
          async
          defer>
  </script>

  <!-- QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript">
  </script>

  <style>

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      font-family: 'GT America', Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #ffffff;
      color: #000000;
      margin: 0;
      min-height: 100vh;
    }

    .header {
      margin-bottom: 30px;
    }

    .header h1 {
      font-family: 'FK Screamer', Impact, sans-serif;
      text-transform: uppercase;
      font-size: 52px;
      line-height: 1;
      margin: 0;
      color: #000000;
    }

    .header p {
      font-family: 'GT America', Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 14px;
      margin-top: 12px;
      color: #000000;
    }

    #login {
      width: 100%;
      max-width: 500px;
      margin: 40px auto;
    }

    #login-message {
      margin-top: 20px;
      font-size: 16px;
    }

    #scanner-section {
      display: none;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      border: 2px solid #000000;
      border-radius: 12px;
      overflow: hidden;
      background: #ffffff;
    }

    #result {
      width: 100%;
      max-width: 500px;
      margin: 25px auto 0;
      padding: 25px;
      border-radius: 12px;
      font-size: 24px;
      font-weight: bold;
      line-height: 1.3;
      transition: all 0.2s ease;
    }

    .approved {
      background: #2E7D32;
      color: #ffffff;
    }

    .rejected {
      background: #C62828;
      color: #ffffff;
    }

    .waiting {
      background: #000000;
      color: #ffffff;
    }

    .camera-error {
      background: #C62828;
      color: #ffffff;
    }

    #reader button {
      font-family: 'GT America', Arial, sans-serif;
      border-radius: 6px;
    }

    #reader select {
      font-family: 'GT America', Arial, sans-serif;
      padding: 8px;
      border-radius: 6px;
    }

    .loading {
      font-size: 18px;
      margin-top: 30px;
    }

    .access-denied {
      background: #C62828;
      color: #ffffff;
      padding: 25px;
      border-radius: 12px;
      max-width: 500px;
      margin: 30px auto;
      font-size: 24px;
      font-weight: bold;
    }

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      .header h1 {
        font-size: 42px;
      }

      .header {
        margin-bottom: 22px;
      }

      #result {
        font-size: 21px;
        padding: 22px;
      }

    }

  </style>

</head>


<body>


  <!-- HEADER -->

  <div class="header">

    <h1>THE BRONX MUSEUM</h1>

    <p>ADMISSION SCANNER</p>

  </div>


  <!-- LOGIN -->

  <div id="login">

    <p style="font-size:20px; margin-bottom:25px;">
      Employee authentication required.
    </p>

    <div id="g_id_onload"
         data-client_id="950942164471-7k7im4k3pcmccpobdqq2udlt0mg1p1in.apps.googleusercontent.com"
         data-callback="handleGoogleCredential"
         data-auto_prompt="false">
    </div>

    <div class="g_id_signin"
         data-type="standard"
         data-size="large"
         data-theme="outline"
         data-text="sign_in_with"
         data-shape="rectangular"
         data-logo_alignment="left">
    </div>

    <div id="login-message"></div>

  </div>


  <!-- SCANNER -->

  <div id="scanner-section">

    <div id="reader"></div>

    <div id="result" class="waiting">
      READY TO SCAN
    </div>

  </div>


  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbx7JSR84v2SabsJbyfS4hTjwL8saEyMyYuOSBgHs8t2CYiZO4D53j4G28An9imGVrsy/exec";


    const GOOGLE_CLIENT_ID =
      "950942164471-7k7im4k3pcmccpobdqq2udlt0mg1p1in.apps.googleusercontent.com";


    let lastScan = "";
    let processing = false;
    let html5QrCode = null;


    /*
     * GOOGLE AUTHENTICATION
     */

    function handleGoogleCredential(response) {

      const loginMessage =
        document.getElementById("login-message");

      loginMessage.innerHTML =
        '<div class="loading">Authenticating...</div>';


      /*
       * Send Google's ID token to Apps Script.
       */

      const authUrl =
        API_URL +
        "?auth=google" +
        "&credential=" +
        encodeURIComponent(response.credential);


      window.location.href = authUrl;

    }


    /*
     * CHECK FOR AUTHORIZATION CODE
     *
     * Apps Script sends the employee back here
     * with ?auth=ONE_TIME_CODE
     */

    function checkAuthorizationCode() {

      const params =
        new URLSearchParams(window.location.search);

      const authCode =
        params.get("auth");


      if (!authCode) {

        return;

      }


      /*
       * Remove the code from the visible URL.
       */

      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );


      document.getElementById("login").style.display =
        "block";

      document.getElementById("login-message").innerHTML =
        '<div class="loading">Verifying employee authorization...</div>';


      const callbackName =
        "authCallback_" + Date.now();


      window[callbackName] = function(data) {

        try {

          if (!data || !data.valid) {

            showAccessDenied(
              data && data.message
                ? data.message
                : "Scanner authorization failed."
            );

            return;

          }


          /*
           * Employee successfully authenticated.
           */

          document.getElementById("login").style.display =
            "none";

          document.getElementById("scanner-section").style.display =
  "block";


startScanner();

        } finally {

          delete window[callbackName];

        }

      };


      const script =
        document.createElement("script");


      script.src =
        API_URL +
        "?api=auth" +
        "&code=" +
        encodeURIComponent(authCode) +
        "&callback=" +
        callbackName;


      script.onerror = function() {

        delete window[callbackName];

        showAccessDenied(
          "Unable to contact the authentication system."
        );

      };


      document.body.appendChild(script);


      setTimeout(function() {

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

      }, 10000);

    }


    /*
     * ACCESS DENIED
     */

    function showAccessDenied(message) {

      document.getElementById("login").innerHTML = `
        <div class="access-denied">
          ACCESS DENIED
        </div>

        <p style="font-size:18px;">
          ${escapeHtml(message)}
        </p>
      `;

    }


    /*
     * RESULT DISPLAY
     */

    function showResult(data) {

      const resultDiv =
        document.getElementById("result");


      if (data.status === "approved") {

        resultDiv.className = "approved";

        resultDiv.innerHTML =
          "✓ ENTRY GRANTED<br><br>" +
          escapeHtml(data.name || "Visitor");

      }

      else {

        resultDiv.className = "rejected";

        resultDiv.innerHTML =
          "✕ " +
          escapeHtml(data.title || "INVALID") +
          "<br><br>" +
          escapeHtml(data.message || "");

      }


      setTimeout(function() {

        resultDiv.className = "waiting";

        resultDiv.innerHTML =
          "READY TO SCAN";

        processing = false;

      }, 3000);

    }


    /*
     * HTML ESCAPE
     */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
     * TICKET API
     */

    function checkTicketFromGitHub(ticketId) {

      if (processing) {
        return;
      }

      processing = true;


      const callbackName =
        "ticketCallback_" +
        Date.now();


      window[callbackName] = function(data) {

        try {

          showResult(data);

        }

        finally {

          delete window[callbackName];

        }

      };


      const script =
        document.createElement("script");


      script.src =
        API_URL +
        "?api=check" +
        "&ticket=" +
        encodeURIComponent(ticketId) +
        "&callback=" +
        callbackName;


      script.onerror = function() {

        delete window[callbackName];


        const resultDiv =
          document.getElementById("result");


        resultDiv.className =
          "rejected";


        resultDiv.innerHTML =
          "✕ CONNECTION ERROR<br><br>" +
          "Unable to contact the ticket system.";


        processing = false;


        setTimeout(function() {

          resultDiv.className =
            "waiting";

          resultDiv.innerHTML =
            "READY TO SCAN";

        }, 3000);

      };


      document.body.appendChild(script);


      setTimeout(function() {

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

      }, 10000);

    }


    /*
     * QR SCAN HANDLER
     */

    function onScanSuccess(decodedText) {

      if (processing) {
        return;
      }


      if (decodedText === lastScan) {
        return;
      }


      lastScan = decodedText;


      let ticketId =
        decodedText;


      try {

        const url =
          new URL(decodedText);


        const extracted =
          url.searchParams.get("ticket");


        if (extracted) {
          ticketId = extracted;
        }

      }

      catch (err) {

        ticketId =
          decodedText;

      }


      checkTicketFromGitHub(ticketId);


      setTimeout(function() {

        lastScan = "";

      }, 3000);

    }


    /*
     * CAMERA ERROR
     */

    function showCameraError(message) {

      const resultDiv =
        document.getElementById("result");


      resultDiv.className =
        "camera-error";


      resultDiv.innerHTML =
        "✕ CAMERA UNAVAILABLE<br><br>" +
        escapeHtml(message);

    }


    /*
     * START SCANNER
     */

    function startScanner() {

      html5QrCode =
        new Html5Qrcode("reader");


      Html5Qrcode.getCameras()

        .then(devices => {

          if (!devices || devices.length === 0) {

            showCameraError(
              "No camera was found on this device."
            );

            return;

          }


          let cameraId =
            devices[0].id;


          const rearCamera =
            devices.find(device => {

              if (!device.label) {
                return false;
              }


              const label =
                device.label.toLowerCase();


              return (
                label.includes("back") ||
                label.includes("rear") ||
                label.includes("environment")
              );

            });


          if (rearCamera) {
            cameraId =
              rearCamera.id;
          }


          return html5QrCode.start(

            cameraId,

            {
              fps: 10,
              qrbox: {
                width: 250,
                height: 250
              }
            },

            onScanSuccess,

            function(errorMessage) {
              // Normal scanning behavior.
            }

          );

        })

        .catch(err => {

          console.error(
            "Camera initialization error:",
            err
          );


          showCameraError(
            "Please allow camera access in Safari."
          );

        });

    }


    /*
     * PAGE LOAD
     */

    window.addEventListener(
      "load",
      checkAuthorizationCode
    );

  </script>


</body>

</html>
