
<!DOCTYPE html>
<html>

<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <meta name="theme-color"
        content="#000000">

  <title>THE BRONX MUSEUM — Admission Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript">
  </script>

  <style>

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #ffffff;
      color: #000000;
      margin: 0;
      min-height: 100vh;
    }

    .header {
      margin-bottom: 30px;
    }

    .header h1 {
      font-family: Impact, Arial, sans-serif;
      text-transform: uppercase;
      font-size: 52px;
      line-height: 1;
      margin: 0;
      color: #000000;
    }

    .header p {
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 14px;
      margin-top: 12px;
      color: #000000;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      border: 2px solid #000000;
      border-radius: 12px;
      overflow: hidden;
      background: #ffffff;
    }

    #result {
      width: 100%;
      max-width: 500px;
      margin: 25px auto 0;
      padding: 25px;
      border-radius: 12px;
      font-size: 24px;
      font-weight: bold;
      line-height: 1.3;
      transition: all 0.2s ease;
    }

    .approved {
      background: #2E7D32;
      color: #ffffff;
    }

    .rejected {
      background: #C62828;
      color: #ffffff;
    }

    .waiting {
      background: #000000;
      color: #ffffff;
    }

    .camera-error {
      background: #C62828;
      color: #ffffff;
    }

    #reader button {
      font-family: Arial, sans-serif;
      border-radius: 6px;
    }

    #reader select {
      font-family: Arial, sans-serif;
      padding: 8px;
      border-radius: 6px;
    }

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      .header h1 {
        font-size: 42px;
      }

      .header {
        margin-bottom: 22px;
      }

      #result {
        font-size: 21px;
        padding: 22px;
      }

    }

  </style>

</head>


<body>


  <div class="header">

    <h1>THE BRONX MUSEUM</h1>

    <p>ADMISSION SCANNER</p>

  </div>


  <div id="reader"></div>


  <div id="result" class="waiting">
    AUTHENTICATING...
  </div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbx7JSR84v2SabsJbyfS4hTjwL8saEyMyYuOSBgHs8t2CYiZO4D53j4G28An9imGVrsy/exec";


let lastScan = "";
let processing = false;


/**************************************************
 * HTML ESCAPE
 **************************************************/

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/**************************************************
 * RESULT DISPLAY
 **************************************************/

function showResult(data) {

  const resultDiv =
    document.getElementById("result");


  if (data.status === "approved") {

    resultDiv.className = "approved";

    resultDiv.innerHTML =
      "✓ ENTRY GRANTED<br><br>" +
      escapeHtml(data.name || "Visitor");

  }

  else if (data.status === "closed") {

    resultDiv.className = "rejected";

    resultDiv.innerHTML =
      "✕ MUSEUM CLOSED<br><br>" +
      escapeHtml(
        data.message || "Museum is currently closed."
      );

  }

  else {

    resultDiv.className = "rejected";

    resultDiv.innerHTML =
      "✕ " +
      escapeHtml(data.title || "INVALID") +
      "<br><br>" +
      escapeHtml(data.message || "");

  }


  setTimeout(function() {

    resultDiv.className = "waiting";

    resultDiv.innerHTML =
      "READY TO SCAN";

    processing = false;

  }, 3000);

}


/**************************************************
 * TICKET VALIDATION
 **************************************************/

function checkTicketFromGitHub(ticketId) {

  if (processing) {
    return;
  }

  processing = true;


  const callbackName =
    "ticketCallback_" + Date.now();


  window[callbackName] = function(data) {

    try {

      showResult(data);

    }

    finally {

      delete window[callbackName];

    }

  };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?api=check" +
    "&ticket=" +
    encodeURIComponent(ticketId) +
    "&callback=" +
    callbackName;


  script.onerror = function() {

    delete window[callbackName];

    const resultDiv =
      document.getElementById("result");


    resultDiv.className = "rejected";

    resultDiv.innerHTML =
      "✕ CONNECTION ERROR<br><br>" +
      "Unable to contact the ticket system.";


    processing = false;


    setTimeout(function() {

      resultDiv.className = "waiting";

      resultDiv.innerHTML =
        "READY TO SCAN";

    }, 3000);

  };


  document.body.appendChild(script);


  setTimeout(function() {

    if (script.parentNode) {

      script.parentNode.removeChild(script);

    }

  }, 10000);

}


/**************************************************
 * QR SCAN HANDLER
 **************************************************/

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }


  if (decodedText === lastScan) {
    return;
  }


  lastScan = decodedText;


  let ticketId = decodedText;


  try {

    const url =
      new URL(decodedText);


    const extracted =
      url.searchParams.get("ticket");


    if (extracted) {

      ticketId = extracted;

    }

  }

  catch (err) {

    ticketId = decodedText;

  }


  checkTicketFromGitHub(ticketId);


  setTimeout(function() {

    lastScan = "";

  }, 3000);

}


/**************************************************
 * CAMERA ERROR
 **************************************************/

function showCameraError(message) {

  const resultDiv =
    document.getElementById("result");


  resultDiv.className =
    "camera-error";


  resultDiv.innerHTML =
    "✕ CAMERA UNAVAILABLE<br><br>" +
    escapeHtml(message);

}


/**************************************************
 * START CAMERA
 **************************************************/

function startScanner() {

  const html5QrCode =
    new Html5Qrcode("reader");


  html5QrCode.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    onScanSuccess,

    function(errorMessage) {

      // Normal scanning behavior.
      // Ignore individual failed frames.

    }

  )

  .then(function() {

    const resultDiv =
      document.getElementById("result");


    resultDiv.className =
      "waiting";


    resultDiv.innerHTML =
      "READY TO SCAN";

  })

  .catch(function(error) {

    console.error(
      "Camera initialization error:",
      error
    );


    showCameraError(
      "Please allow camera access in Safari."
    );

  });

}



/**************************************************
 * EMPLOYEE AUTHENTICATION
 *
 * Uses JSONP instead of fetch() because this page
 * is hosted on GitHub Pages and the backend is
 * hosted on Google Apps Script.
 **************************************************/

function authenticateEmployee() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const authCode =
    params.get("auth");


  if (!authCode) {

    document.getElementById("result").className =
      "rejected";

    document.getElementById("result").innerHTML =
      "✕ EMPLOYEE AUTHENTICATION REQUIRED";

    return;

  }


  const resultDiv =
    document.getElementById("result");


  resultDiv.className =
    "waiting";


  resultDiv.innerHTML =
    "AUTHENTICATING...";


  /**************************************************
   * CREATE JSONP CALLBACK
   **************************************************/

  const callbackName =
    "authCallback_" + Date.now();


  window[callbackName] =
    function(data) {

      try {

        if (!data.valid) {

          resultDiv.className =
            "rejected";


          resultDiv.innerHTML =
            "✕ AUTHENTICATION FAILED<br><br>" +
            escapeHtml(
              data.message ||
              "Employee authentication failed."
            );

          return;

        }


        /*
         * Authentication succeeded.
         *
         * Remove the one-time authorization code
         * from the visible browser URL.
         */

        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );


        /*
         * Start the camera only after successful
         * employee authentication.
         */

        startScanner();

      }

      finally {

        delete window[callbackName];

      }

    };


  /**************************************************
   * CREATE JSONP SCRIPT REQUEST
   **************************************************/

  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?api=auth" +
    "&code=" +
    encodeURIComponent(authCode) +
    "&callback=" +
    encodeURIComponent(callbackName);


  script.onerror =
    function() {

      delete window[callbackName];


      resultDiv.className =
        "rejected";


      resultDiv.innerHTML =
        "✕ AUTHENTICATION FAILED<br><br>" +
        "Unable to contact the employee authentication system.";

    };


  document.body.appendChild(script);


  /**************************************************
   * CLEAN UP REQUEST AFTER 10 SECONDS
   **************************************************/

  setTimeout(
    function() {

      if (script.parentNode) {

        script.parentNode.removeChild(script);

      }

      delete window[callbackName];

    },
    10000
  );

}


      /*
       * Authentication succeeded.
       *
       * Remove the one-time authorization code
       * from the browser URL so it cannot accidentally
       * be reused.
       */

      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );


      /*
       * IMPORTANT:
       *
       * Start the camera only after authentication
       * has successfully completed.
       */

      startScanner();

    })

    .catch(function(error) {

      console.error(
        "Employee authentication error:",
        error
      );


      document.getElementById("result").className =
        "rejected";


      document.getElementById("result").innerHTML =
        "✕ AUTHENTICATION FAILED<br><br>" +
        escapeHtml(error.message);

    });

}


/**************************************************
 * START APPLICATION
 **************************************************/

window.addEventListener(
  "load",
  authenticateEmployee
);

</script>


</body>

</html>
