<!DOCTYPE html>
<html>

<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <meta name="theme-color"
        content="#000000">

  <title>THE BRONX MUSEUM — Admission Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript">
  </script>

  <style>

    /* ==================================================
       BRONX MUSEUM BASE STYLES
       ================================================== */

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      font-family: 'GT America', Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #ffffff;
      color: #000000;
      margin: 0;
      min-height: 100vh;
    }


    /* ==================================================
       HEADER
       ================================================== */

    .header {
      margin-bottom: 30px;
    }

    .header h1 {
      font-family: 'FK Screamer', Impact, sans-serif;
      text-transform: uppercase;
      font-size: 52px;
      line-height: 1;
      margin: 0;
      color: #000000;
    }

    .header p {
      font-family: 'GT America', Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 14px;
      margin-top: 12px;
      color: #000000;
    }


    /* ==================================================
       SCANNER
       ================================================== */

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      border: 2px solid #000000;
      border-radius: 12px;
      overflow: hidden;
      background: #ffffff;
    }


    /* ==================================================
       RESULT
       ================================================== */

    #result {
      width: 100%;
      max-width: 500px;
      margin: 25px auto 0;
      padding: 25px;
      border-radius: 12px;
      font-size: 24px;
      font-weight: bold;
      line-height: 1.3;
      transition: all 0.2s ease;
    }


    /* ==================================================
       STATUS STATES
       ================================================== */

    .approved {
      background: #2E7D32;
      color: #ffffff;
    }

    .rejected {
      background: #C62828;
      color: #ffffff;
    }

    .waiting {
      background: #000000;
      color: #ffffff;
    }


    /* ==================================================
       CAMERA ERROR
       ================================================== */

    .camera-error {
      background: #C62828;
      color: #ffffff;
    }


    /* ==================================================
       SCANNER TEXT OVERRIDES
       ================================================== */

    #reader button {
      font-family: 'GT America', Arial, sans-serif;
      border-radius: 6px;
    }

    #reader select {
      font-family: 'GT America', Arial, sans-serif;
      padding: 8px;
      border-radius: 6px;
    }


    /* ==================================================
       MOBILE / IPAD
       ================================================== */

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      .header h1 {
        font-size: 42px;
      }

      .header {
        margin-bottom: 22px;
      }

      #result {
        font-size: 21px;
        padding: 22px;
      }

    }

  </style>

</head>


<body>


  <!-- ==================================================
       HEADER
       ================================================== -->

  <div class="header">

    <h1>THE BRONX MUSEUM</h1>

    <p>ADMISSION SCANNER</p>

  </div>


  <!-- ==================================================
       QR SCANNER
       ================================================== -->

  <div id="reader"></div>


  <!-- ==================================================
       RESULT DISPLAY
       ================================================== -->

  <div id="result" class="waiting">
    READY TO SCAN
  </div>


  <script>

    /******************************************************
     * APPS SCRIPT BACKEND
     ******************************************************/

    const API_URL =
      "https://script.google.com/macros/s/AKfycbx7JSR84v2SabsJbyfS4hTjwL8saEyMyYuOSBgHs8t2CYiZO4D53j4G28An9imGVrsy/exec";


    /******************************************************
     * SCANNER STATE
     ******************************************************/

    let lastScan = "";
    let processing = false;


    /******************************************************
     * RESULT DISPLAY
     ******************************************************/

    function showResult(data) {

      const resultDiv =
        document.getElementById("result");


      if (data.status === "approved") {

        resultDiv.className = "approved";

        resultDiv.innerHTML =
          "✓ ENTRY GRANTED<br><br>" +
          escapeHtml(data.name || "Visitor");


      } else {

        resultDiv.className = "rejected";

        resultDiv.innerHTML =
          "✕ " +
          escapeHtml(data.title || "INVALID") +
          "<br><br>" +
          escapeHtml(data.message || "");

      }


      setTimeout(function() {

        resultDiv.className = "waiting";

        resultDiv.innerHTML =
          "READY TO SCAN";

        processing = false;

      }, 3000);

    }


    /******************************************************
     * HTML ESCAPE
     ******************************************************/

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /******************************************************
     * APPS SCRIPT API CALL
     *
     * JSONP avoids the browser's cross-origin
     * restriction between GitHub Pages and Apps Script.
     ******************************************************/

    function checkTicketFromGitHub(ticketId) {

      if (processing) {
        return;
      }

      processing = true;


      const callbackName =
        "ticketCallback_" +
        Date.now();


      window[callbackName] = function(data) {

        try {

          showResult(data);

        } finally {

          delete window[callbackName];

        }

      };


      const script =
        document.createElement("script");


      const separator =
        API_URL.includes("?") ? "&" : "?";


      script.src =
        API_URL +
        separator +
        "api=check" +
        "&ticket=" +
        encodeURIComponent(ticketId) +
        "&callback=" +
        callbackName;


      script.onerror = function() {

        delete window[callbackName];

        const resultDiv =
          document.getElementById("result");

        resultDiv.className = "rejected";

        resultDiv.innerHTML =
          "✕ CONNECTION ERROR<br><br>" +
          "Unable to contact the ticket system.";

        processing = false;

        setTimeout(function() {

          resultDiv.className = "waiting";

          resultDiv.innerHTML =
            "READY TO SCAN";

        }, 3000);

      };


      document.body.appendChild(script);


      setTimeout(function() {

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

      }, 10000);

    }


    /******************************************************
     * QR SCAN HANDLER
     ******************************************************/

    function onScanSuccess(decodedText) {

      if (processing) {
        return;
      }


      if (decodedText === lastScan) {
        return;
      }


      lastScan = decodedText;


      let ticketId = decodedText;


      /*
       * Your existing QR codes contain:
       *
       * WEB_APP_URL?ticket=UUID
       *
       * Extract the ticket parameter when
       * a URL is scanned.
       */

      try {

        const url =
          new URL(decodedText);

        const extracted =
          url.searchParams.get("ticket");

        if (extracted) {
          ticketId = extracted;
        }

      } catch (err) {

        /*
         * If the QR code is just the UUID itself,
         * use it directly.
         */

        ticketId = decodedText;

      }


      checkTicketFromGitHub(ticketId);


      /*
       * Allow the same QR code to be scanned again
       * after the result cycle has completed.
       */

      setTimeout(function() {

        lastScan = "";

      }, 3000);

    }


    /******************************************************
     * CAMERA ERROR
     ******************************************************/

    function showCameraError(message) {

      const resultDiv =
        document.getElementById("result");

      resultDiv.className = "camera-error";

      resultDiv.innerHTML =
        "✕ CAMERA UNAVAILABLE<br><br>" +
        escapeHtml(message);

    }


    /******************************************************
     * CAMERA INITIALIZATION
     ******************************************************/

    const html5QrCode =
      new Html5Qrcode("reader");


    function startScanner() {

      Html5Qrcode.getCameras()

        .then(devices => {

          if (!devices || devices.length === 0) {

            showCameraError(
              "No camera was found on this device."
            );

            return;

          }


          /*
           * Default to first available camera.
           */

          let cameraId =
            devices[0].id;


          /*
           * Prefer rear-facing camera when
           * the browser exposes its label.
           */

          const rearCamera =
            devices.find(device => {

              if (!device.label) {
                return false;
              }

              const label =
                device.label.toLowerCase();

              return (
                label.includes("back") ||
                label.includes("rear") ||
                label.includes("environment")
              );

            });


          if (rearCamera) {
            cameraId = rearCamera.id;
          }


          /*
           * Start camera.
           */

          return html5QrCode.start(

            cameraId,

            {
              fps: 10,
              qrbox: {
                width: 250,
                height: 250
              }
            },

            onScanSuccess,

            function(errorMessage) {

              /*
               * Normal scanning behavior.
               * Do not display every failed frame.
               */

            }

          );

        })

        .catch(err => {

          console.error(
            "Camera initialization error:",
            err
          );


          showCameraError(
            "Please allow camera access in Safari."
          );

        });

    }


    /******************************************************
     * START AFTER PAGE LOAD
     ******************************************************/

    window.addEventListener(
      "load",
      startScanner
    );

  </script>


</body>

</html>
